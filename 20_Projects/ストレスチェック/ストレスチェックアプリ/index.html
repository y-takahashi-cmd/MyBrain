<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コンディションチェック｜企業のオンライン保健室</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f0f9ff;
      min-height: 100vh;
      color: #1e293b;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 30px 0 24px;
    }
    .header .subtitle {
      font-size: 12px;
      color: #0ea5e9;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      color: #1e293b;
    }
    .header h1 span { color: #0284c7; }

    /* カード共通 */
    .card {
      background: #fff;
      border: 1px solid #bae6fd;
      border-radius: 16px;
      padding: 24px 20px;
      margin-bottom: 16px;
    }

    /* 初期画面 */
    #screen-start .notice-list {
      list-style: none;
      margin: 16px 0 24px;
    }
    #screen-start .notice-list li {
      padding: 8px 0;
      font-size: 14px;
      color: #475569;
      border-bottom: 1px solid #e0f2fe;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #screen-start .notice-list li::before {
      content: '✓';
      color: #0284c7;
      font-weight: bold;
    }
    #screen-start .time-badge {
      text-align: center;
      font-size: 13px;
      color: #0284c7;
      background: #e0f2fe;
      border-radius: 20px;
      padding: 6px 16px;
      display: inline-block;
      margin-bottom: 20px;
    }

    /* プログレスバー */
    .progress-wrap {
      margin-bottom: 20px;
    }
    .progress-label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar {
      height: 6px;
      background: #e0f2fe;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* 質問画面 */
    .q-label {
      font-size: 12px;
      color: #0ea5e9;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .q-text {
      font-size: 18px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 6px;
      line-height: 1.5;
    }
    .q-hint {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    /* スコアボタン */
    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .score-btn {
      background: #f0f9ff;
      border: 2px solid #bae6fd;
      border-radius: 10px;
      padding: 12px 4px;
      font-size: 16px;
      font-weight: bold;
      color: #0284c7;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .score-btn:hover { background: #e0f2fe; }
    .score-btn.selected {
      background: #1e3a5f;
      border-color: #1e3a5f;
      color: #fff;
    }
    .score-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      padding: 0 4px;
      margin-bottom: 24px;
    }

    /* ボタン共通 */
    .btn-primary {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #1e3a5f, #0c2240);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    /* 完了画面 */
    #screen-done .done-icon {
      text-align: center;
      font-size: 56px;
      margin-bottom: 16px;
    }
    #screen-done h2 {
      text-align: center;
      font-size: 20px;
      color: #1e293b;
      margin-bottom: 16px;
    }
    #screen-done p {
      font-size: 14px;
      color: #475569;
      line-height: 1.8;
      text-align: center;
    }

    /* フェードアニメーション */
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .sending { text-align: center; color: #64748b; font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <p class="subtitle">CORPORATE HEALTH CHECK</p>
    <h1><span>1分</span>で終わる<br>コンディションチェック</h1>
  </div>

  <!-- 初期画面 -->
  <div id="screen-start" class="screen active">
    <div class="card">
      <ul class="notice-list">
        <li>個人は特定されない形で集計されます</li>
        <li>職場環境の改善に活用されます</li>
        <li>回答は安全に保管されます</li>
      </ul>
      <div style="text-align:center; margin-bottom:20px;">
        <span class="time-badge">⏱ 所要時間：約1分</span>
      </div>
      <button class="btn-primary" onclick="startCheck()">はじめる</button>
    </div>
  </div>

  <!-- 質問画面 -->
  <div id="screen-questions" class="screen">
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="q-counter">質問 1 / 6</span>
          <span id="q-percent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <p class="q-label" id="q-label">Q1</p>
      <p class="q-text" id="q-text"></p>
      <p class="q-hint" id="q-hint"></p>

      <div class="score-grid" id="score-grid"></div>
      <div class="score-labels">
        <span id="label-low"></span>
        <span id="label-high"></span>
      </div>

      <button class="btn-primary" id="btn-next" onclick="nextQuestion()" disabled>次へ →</button>
    </div>
  </div>

  <!-- 送信中 -->
  <div id="screen-sending" class="screen">
    <div class="card">
      <div class="sending">送信中...</div>
    </div>
  </div>

  <!-- 完了画面 -->
  <div id="screen-done" class="screen">
    <div class="card">
      <div class="done-icon">✅</div>
      <h2>ご回答ありがとうございました</h2>
      <p>
        あなたの回答は職場環境の<br>改善に活用されます。<br><br>
        来月もご協力をお願いします。
      </p>
    </div>
  </div>

</div>

<script>
  // ===== 設定 =====
  const GAS_URL = 'YOUR_GAS_URL'; // Apps Script Web App URL を入れる

  const QUESTIONS = [
    { id: 'Q1', text: '今日の体調はいかがですか？', hint: '身体的なコンディション全般', labelLow: '0 とても悪い', labelHigh: '10 とても良い', type: 'good' },
    { id: 'Q2', text: '仕事への集中力はありますか？', hint: '今の仕事のパフォーマンスについて', labelLow: '0 全く集中できない', labelHigh: '10 とても集中できる', type: 'good' },
    { id: 'Q3', text: 'ストレスを感じていますか？', hint: '精神的なプレッシャーについて', labelLow: '0 全く感じない', labelHigh: '10 とても感じる', type: 'stress' },
    { id: 'Q4', text: '睡眠の質はどうでしたか？', hint: '最近1週間の睡眠について', labelLow: '0 とても悪い', labelHigh: '10 とても良い', type: 'good' },
    { id: 'Q5', text: '職場の人間関係にストレスを感じますか？', hint: '上司・同僚・部下との関係について', labelLow: '0 全く感じない', labelHigh: '10 とても感じる', type: 'stress' },
    { id: 'Q6', text: '仕事の量に負担を感じますか？', hint: '業務量・残業・タスク量について', labelLow: '0 全く感じない', labelHigh: '10 とても感じる', type: 'stress' },
  ];

  let current = 0;
  let scores = [];
  let selectedScore = null;
  let employeeId = '';
  let companyId = '';

  // URLパラメーター取得
  function getParam(key) {
    return new URLSearchParams(location.search).get(key) || '';
  }

  function startCheck() {
    employeeId = getParam('id') || 'UNKNOWN';
    companyId  = getParam('company') || 'UNKNOWN';
    current = 0;
    scores = [];
    showScreen('screen-questions');
    renderQuestion();
  }

  function renderQuestion() {
    const q = QUESTIONS[current];
    document.getElementById('q-label').textContent = q.id;
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('q-hint').textContent = q.hint;
    document.getElementById('label-low').textContent = q.labelLow;
    document.getElementById('label-high').textContent = q.labelHigh;
    document.getElementById('q-counter').textContent = `質問 ${current + 1} / ${QUESTIONS.length}`;
    const pct = Math.round(current / QUESTIONS.length * 100);
    document.getElementById('q-percent').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';

    // スコアボタン生成
    const grid = document.getElementById('score-grid');
    grid.innerHTML = '';
    for (let i = 0; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.className = 'score-btn';
      btn.textContent = i;
      btn.dataset.val = i;
      btn.onclick = () => selectScore(i);
      grid.appendChild(btn);
    }

    selectedScore = null;
    document.getElementById('btn-next').disabled = true;
  }

  function selectScore(val) {
    selectedScore = val;
    document.querySelectorAll('.score-btn').forEach(b => {
      b.classList.toggle('selected', parseInt(b.dataset.val) === val);
    });
    document.getElementById('btn-next').disabled = false;
  }

  function nextQuestion() {
    if (selectedScore === null) return;
    scores.push(selectedScore);
    current++;
    if (current < QUESTIONS.length) {
      renderQuestion();
    } else {
      submitAnswers();
    }
  }

  async function submitAnswers() {
    showScreen('screen-sending');
    const now = new Date();
    const yearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    const payload = {
      employeeId,
      companyId,
      yearMonth,
      timestamp: now.toISOString(),
      Q1: scores[0],
      Q2: scores[1],
      Q3: scores[2],
      Q4: scores[3],
      Q5: scores[4],
      Q6: scores[5],
    };

    try {
      if (GAS_URL !== 'YOUR_GAS_URL') {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      } else {
        // テスト用：コンソールに表示
        console.log('送信データ:', payload);
        await new Promise(r => setTimeout(r, 800));
      }
    } catch(e) {
      console.error('送信エラー:', e);
    }
    showScreen('screen-done');
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
