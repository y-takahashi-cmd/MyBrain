<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ストレスチェック実施準備・運用確認台帳（ワイヤーフレーム）</title>
<style>
  :root{
    --brand:#74B2E0; --brand-deep:#2E6BA6; --brand-deeper:#1A3A5C; --brand-soft:#A3CDE8; --brand-line:#C5DDE9;
    --page-bg:#F2F8FC; --card-bg:#FFFFFF; --card-bg-tint:#F8FBFE;
    --text-heading:#1A3A5C; --text-body:#4A4A4A; --text-sub:#666666;
    --border:#E0E0E0; --border-soft:#D6E9F5;
    --success-50:#E6F5EB; --success-500:#28A745; --success-700:#1B7D3A;
    --warning-50:#FFF8E1; --warning-500:#F0AD00; --warning-700:#C68A00;
    --error-50:#FDEAEA; --error-500:#DC3545; --error-700:#B71C1C;
    --info-50:#F2F8FC;
    --font-head:"Hiragino Sans","Yu Gothic UI","Segoe UI",system-ui,sans-serif;
    --font-body:"Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",system-ui,sans-serif;
    --shadow-card: 0 1px 2px rgba(26,58,92,.06), 0 8px 24px rgba(26,58,92,.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page-bg:#0F1B2A; --card-bg:#1A2940; --card-bg-tint:#192538;
      --text-heading:#A3CDE8; --text-body:#CCDDEE; --text-sub:#8899AA;
      --border:#2A3950; --border-soft:#233350; --brand-line:#2A3950;
      --success-50:#12271B; --success-700:#7DD39B; --warning-50:#2A2311; --warning-700:#FFD666;
      --error-50:#2A1414; --error-700:#F09DA5; --info-50:#12233A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#0F1B2A; --card-bg:#1A2940; --card-bg-tint:#192538;
    --text-heading:#A3CDE8; --text-body:#CCDDEE; --text-sub:#8899AA;
    --border:#2A3950; --border-soft:#233350; --brand-line:#2A3950;
    --success-50:#12271B; --success-700:#7DD39B; --warning-50:#2A2311; --warning-700:#FFD666;
    --error-50:#2A1414; --error-700:#F09DA5; --info-50:#12233A;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --page-bg:#F2F8FC; --card-bg:#FFFFFF; --card-bg-tint:#F8FBFE;
    --text-heading:#1A3A5C; --text-body:#4A4A4A; --text-sub:#666666;
    --border:#E0E0E0; --border-soft:#D6E9F5; --brand-line:#C5DDE9;
    --success-50:#E6F5EB; --success-700:#1B7D3A; --warning-50:#FFF8E1; --warning-700:#C68A00;
    --error-50:#FDEAEA; --error-700:#B71C1C; --info-50:#F2F8FC;
    color-scheme: light;
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page-bg); color:var(--text-body); font-family:var(--font-body); font-size:14.5px; line-height:1.6; }
  h1,h2,h3{ font-family:var(--font-head); color:var(--text-heading); margin:0; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- wireframe chrome (not part of the product) ---------- */
  .wf-banner{
    background:var(--brand-deeper); color:#fff; padding:.5rem 1.2rem;
    font-size:.78rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap;
  }
  .wf-banner b{ background:rgba(255,255,255,.15); padding:.1rem .5rem; border-radius:999px; }
  .wf-tabs{ display:flex; gap:.4rem; }
  .wf-tabs button{
    border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; border-radius:999px;
    padding:.25rem .85rem; font-size:.78rem; font-weight:700;
  }
  .wf-tabs button.active{ background:#fff; color:var(--brand-deeper); }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ================= SCREEN A ================= */
  #screenA .wrap{ max-width:900px; margin:0 auto; padding:2.4rem 1.5rem 4rem; }
  #screenA .head{ margin-bottom:1.6rem; }
  #screenA .head .eyebrow{ font-size:.72rem; letter-spacing:.12em; font-weight:700; color:var(--brand-deep); text-transform:uppercase; }
  #screenA .head h1{ font-size:1.5rem; font-weight:800; margin:.3rem 0 .3rem; }
  #screenA .head p{ color:var(--text-sub); font-size:.9rem; margin:0; }

  .company-list{ display:flex; flex-direction:column; gap:.9rem; margin-top:1.4rem; }
  .company-card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:1.1rem 1.3rem;
    box-shadow:var(--shadow-card); display:grid; grid-template-columns:1.6fr 1fr 1fr auto; gap:1rem; align-items:center;
    cursor:pointer; transition:border-color .15s;
  }
  .company-card:hover{ border-color:var(--brand); }
  @media (max-width:760px){ .company-card{ grid-template-columns:1fr; } }
  .company-card .name{ font-weight:800; color:var(--text-heading); font-size:1.02rem; }
  .company-card .sub{ font-size:.78rem; color:var(--text-sub); margin-top:.15rem; }
  .company-card .stat{ font-size:.8rem; color:var(--text-body); }
  .company-card .stat b{ font-variant-numeric:tabular-nums; color:var(--text-heading); }
  .mini-bar{ height:6px; border-radius:999px; background:var(--border-soft); overflow:hidden; margin-top:.3rem; width:120px; }
  .mini-bar .fill{ height:100%; background:var(--brand); }
  .company-card .go{ font-size:.8rem; font-weight:700; color:var(--brand-deep); white-space:nowrap; }
  .add-company{
    border:1.5px dashed var(--brand-line); border-radius:14px; padding:1rem 1.3rem; text-align:center;
    color:var(--brand-deep); font-weight:700; font-size:.88rem; background:transparent;
  }

  /* ================= SCREEN B ================= */
  #screenB{ min-height:100vh; }
  .topstat{ background:linear-gradient(135deg, var(--brand-deep) 0%, var(--brand) 100%); color:#fff; padding:1.1rem 1.4rem; }
  .topstat .row1{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:.6rem; }
  .topstat .row1 .title{ font-size:1.15rem; font-weight:800; }
  .topstat .row1 .back{ font-size:.78rem; background:rgba(255,255,255,.18); border:none; color:#fff; padding:.3rem .8rem; border-radius:999px; }
  .topstat .row1 .title-input{
    font-family:var(--font-head); font-size:1.15rem; font-weight:800; color:#fff; background:transparent;
    border:none; border-bottom:1.5px solid rgba(255,255,255,.4); padding:.1rem .1rem; min-width:14em; outline:none;
  }
  .topstat .row1 .title-input::placeholder{ color:rgba(255,255,255,.65); font-weight:600; }
  .topstat .row1 .title-suffix{ font-size:1.02rem; font-weight:700; color:#EAF4FC; opacity:.9; }
  .topstat .meta-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem 1.4rem; margin-top:.8rem; font-size:.78rem;
  }
  @media (max-width:900px){ .topstat .meta-grid{ grid-template-columns:repeat(2,1fr); } }
  .topstat .meta-grid .k{ color:#DCEEFA; opacity:.85; display:block; margin-bottom:.15rem; }
  .topstat .meta-grid .v{ font-weight:700; }
  .topstat .meta-grid input{
    width:100%; font-family:var(--font-body); font-size:.85rem; font-weight:700; color:#fff; background:transparent;
    border:none; border-bottom:1px solid rgba(255,255,255,.35); padding:.1rem 0; outline:none;
  }
  .topstat .meta-grid input::placeholder{ color:rgba(255,255,255,.6); font-weight:500; }
  .topstat .save-note{ font-size:.7rem; color:#DCEEFA; opacity:.8; margin-top:.6rem; }
  .topstat .stat-strip{ display:flex; gap:1.6rem; margin-top:.9rem; flex-wrap:wrap; }
  .topstat .stat-strip .item{ font-size:.8rem; }
  .topstat .stat-strip .item .num{ font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; display:block; }

  .b-shell{ display:grid; grid-template-columns:270px minmax(0,1fr); }
  @media (max-width:860px){ .b-shell{ grid-template-columns:1fr; } }

  .b-nav{ border-right:1px solid var(--border); background:var(--card-bg); }
  @media (max-width:860px){ .b-nav{ border-right:none; border-bottom:1px solid var(--border); } }
  .b-nav-scroll{ max-height:calc(100vh - 148px); overflow-y:auto; padding:.8rem; }
  @media (max-width:860px){ .b-nav-scroll{ max-height:220px; } }
  .chap-btn{
    width:100%; text-align:left; border:none; background:transparent; border-radius:10px;
    padding:.55rem .7rem; display:flex; align-items:center; gap:.6rem; margin-bottom:.15rem; font-size:.83rem; color:var(--text-body);
  }
  .chap-btn:hover{ background:var(--card-bg-tint); }
  .chap-btn.active{ background:var(--info-50); color:var(--brand-deep); font-weight:700; border:1px solid var(--brand-line); }
  .chap-btn .no{ font-variant-numeric:tabular-nums; color:var(--text-sub); width:1.5em; flex:0 0 auto; }
  .chap-btn.active .no{ color:var(--brand-deep); }
  .chap-btn .lbl{ flex:1; min-width:0; }
  .chap-btn .cnt{ font-size:.68rem; color:var(--text-sub); font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .chap-btn .turn-dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .turn-company{ background:var(--warning-500); }
  .turn-us{ background:var(--brand); }
  .turn-jisshi{ background:var(--brand-deeper); }
  .turn-doctor{ background:var(--text-sub); }
  .turn-none{ background:var(--border); }

  .chap-btn.overview-btn{ background:var(--info-50); border:1px solid var(--brand-line); margin-bottom:.7rem; font-weight:700; color:var(--brand-deep); }
  .chap-btn.overview-btn.active{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .chap-btn.overview-btn .no{ color:inherit; }
  .nav-divider{ height:1px; background:var(--border); margin:.3rem .3rem .6rem; }

  /* ---------- overview screen ---------- */
  .ov-summary{ display:flex; flex-direction:column; gap:.35rem; margin-bottom:1.6rem; }
  .ov-row{
    display:grid; grid-template-columns:2.4rem 1fr 6rem 4.5rem 1rem; align-items:center; gap:.7rem;
    padding:.4rem .5rem; border-radius:8px; font-size:.8rem;
  }
  .ov-row:hover{ background:var(--card-bg-tint); }
  .ov-row .no{ font-variant-numeric:tabular-nums; color:var(--text-sub); }
  .ov-row .lbl{ color:var(--text-body); font-weight:600; }
  .ov-row .lbl.empty-chap{ color:var(--text-sub); font-weight:400; font-style:italic; }
  .ov-row .cnt{ font-variant-numeric:tabular-nums; color:var(--text-sub); text-align:right; }
  .ov-bar{ height:6px; border-radius:999px; background:var(--border-soft); overflow:hidden; }
  .ov-bar .fill{ height:100%; background:var(--success-700); }
  .ov-row .turn-dot{ width:7px; height:7px; border-radius:50%; justify-self:center; }

  .ov-divider{ font-size:.72rem; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.06em; margin:1.6rem 0 .6rem; }

  .b-main{ padding:1.4rem 1.6rem 4rem; }
  .b-main .chap-head{ display:flex; align-items:baseline; gap:.7rem; margin-bottom:.3rem; flex-wrap:wrap; }
  .b-main .chap-head h2{ font-size:1.15rem; font-weight:800; }
  .b-main .chap-head .no{ font-variant-numeric:tabular-nums; color:var(--brand); background:var(--info-50); border:1px solid var(--brand-line); border-radius:8px; padding:.1rem .5rem; font-weight:800; font-size:.85rem; }
  .b-main .chap-desc{ color:var(--text-sub); font-size:.85rem; margin:0 0 1.1rem; }

  .legend{ display:flex; gap:1rem; flex-wrap:wrap; font-size:.75rem; color:var(--text-sub); margin-bottom:.8rem; }
  .legend span{ display:inline-flex; align-items:center; gap:.35em; }
  .legend .dot{ width:7px; height:7px; border-radius:50%; }

  .item-table{ width:100%; border-collapse:collapse; background:var(--card-bg); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow-card); }
  .item-table thead th{ background:var(--info-50); color:var(--text-heading); font-size:.72rem; font-weight:700; text-align:left; padding:.6rem .75rem; white-space:nowrap; }
  .item-table tbody td{ padding:.62rem .75rem; border-top:1px solid var(--border); font-size:.83rem; vertical-align:top; }
  .item-table tbody tr{ cursor:pointer; }
  .item-table tbody tr:hover{ background:var(--card-bg-tint); }
  .item-table tbody tr.is-done{ }
  .item-table .col-done{ width:2.2rem; text-align:center; }
  .item-table .check{ width:1.2em; height:1.2em; border-radius:5px; border:2px solid var(--border); display:inline-block; }
  .item-table .check.on{ background:var(--success-700); border-color:var(--success-700); position:relative; }
  .item-table .check.on::after{ content:"✓"; color:#fff; font-size:.7rem; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .item-table .name{ font-weight:700; color:var(--text-heading); }
  .item-table .name .type-tag{ display:block; font-size:.66rem; font-weight:600; color:var(--brand-deep); margin-top:.15rem; }
  .item-table .muted{ color:var(--text-sub); }
  .item-table .col-detail{ color:var(--brand-deep); font-size:.78rem; font-weight:700; white-space:nowrap; }

  .status-pill{ display:inline-flex; align-items:center; font-size:.7rem; font-weight:700; padding:.15rem .55rem; border-radius:999px; white-space:nowrap; }
  .st-未着手{ background:var(--card-bg-tint); color:var(--text-sub); border:1px solid var(--border); }
  .st-準備中{ background:var(--info-50); color:var(--brand-deep); border:1px solid var(--brand-line); }
  .st-実施中{ background:var(--brand-soft); color:var(--brand-deeper); }
  .st-確認待ち{ background:var(--warning-50); color:var(--warning-700); }
  .st-完了{ background:var(--success-50); color:var(--success-700); }
  .st-期限超過{ background:var(--error-50); color:var(--error-700); }
  .st-保留{ background:var(--card-bg-tint); color:var(--text-sub); border:1px dashed var(--border); }

  .owner-tag{ font-size:.7rem; color:var(--text-sub); }

  .placeholder-chap{ background:var(--card-bg); border:1px dashed var(--border); border-radius:12px; padding:2rem; text-align:center; color:var(--text-sub); font-size:.85rem; }

  /* ---------- detail drawer (screen C) ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(15,27,42,.35); display:none; z-index:40; }
  .overlay.show{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(480px,100%); background:var(--card-bg);
    box-shadow:-8px 0 30px rgba(0,0,0,.15); z-index:41; transform:translateX(100%); transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  .drawer.show{ transform:translateX(0); }
  @media (prefers-reduced-motion: reduce){ .drawer{ transition:none; } }
  .drawer-head{ padding:1.1rem 1.3rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:.8rem; }
  .drawer-head .chap-no{ font-size:.72rem; color:var(--brand-deep); font-weight:700; letter-spacing:.04em; }
  .drawer-head h3{ font-size:1.05rem; font-weight:800; margin:.2rem 0 0; }
  .drawer-head button{ border:none; background:var(--card-bg-tint); border-radius:8px; width:2em; height:2em; color:var(--text-sub); font-size:1rem; }
  .drawer-body{ padding:1.2rem 1.3rem; overflow-y:auto; flex:1; }
  .drawer-foot{ padding:1rem 1.3rem; border-top:1px solid var(--border); }

  .type-badge{ display:inline-block; font-size:.7rem; font-weight:700; padding:.2rem .6rem; border-radius:999px; background:var(--info-50); color:var(--brand-deep); border:1px solid var(--brand-line); margin-bottom:.9rem; }

  .d-block{ margin:0 0 1.3rem; }
  .d-block .d-label{ font-size:.72rem; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.35rem; }
  .d-block .d-static{ font-size:.87rem; color:var(--text-body); background:var(--card-bg-tint); border:1px solid var(--border); border-radius:8px; padding:.55rem .7rem; line-height:1.6; }
  .d-grid{ display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
  .d-field label{ display:block; font-size:.72rem; font-weight:700; color:var(--text-sub); margin-bottom:.3rem; }
  .d-field input, .d-field select, .d-field textarea{
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:.45rem .6rem; font-size:.85rem;
    font-family:var(--font-body); color:var(--text-heading); background:var(--card-bg);
  }
  .d-field input:focus, .d-field select:focus, .d-field textarea:focus{ outline:none; border-color:var(--brand); }
  .d-block > select, .d-block > textarea{
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:.5rem .65rem; font-size:.87rem;
    font-family:var(--font-body); color:var(--text-heading); background:var(--card-bg); resize:vertical;
  }
  .d-block > select:focus, .d-block > textarea:focus{ outline:none; border-color:var(--brand); }
  .d-field.empty input, .d-field.empty select{ border-color:var(--warning-500); background:var(--warning-50); }
  .d-field .req{ color:var(--error-500); }

  .complete-box{ border:1px solid var(--border); border-radius:10px; padding:.9rem 1rem; background:var(--card-bg-tint); }
  .complete-box.blocked{ border-color:var(--warning-500); background:var(--warning-50); }
  .complete-box .cb-row{ display:flex; align-items:center; gap:.6rem; font-weight:700; color:var(--text-heading); font-size:.9rem; }
  .complete-box .cb-row input{ width:1.2em; height:1.2em; }
  .complete-box .cb-note{ font-size:.78rem; color:var(--warning-700); margin-top:.5rem; }
  .complete-box .cb-note ul{ margin:.3rem 0 0; padding-left:1.2em; }

  .footer-note{ max-width:1180px; margin:0 auto; padding:1.5rem; color:var(--text-sub); font-size:.78rem; }
</style>
</head>
<body>

<div class="wf-banner">
  <span>🧩 ワイヤーフレーム確認用（会社名を入力すれば、どの契約企業にも使い回せます）</span>
</div>

<!-- ========================= 台帳（会社ごとに1本・会社名を入力して使う） ========================= -->
<section id="screenB" class="screen active">
  <div class="topstat">
    <div class="row1">
      <input type="text" id="f-company" class="title-input" placeholder="◯◯株式会社">
      <span class="title-suffix">— ストレスチェック実施準備・運用確認台帳</span>
    </div>
    <div class="meta-grid">
      <div><span class="k">事業場名</span><input type="text" id="f-worksite" placeholder="例：全社"></div>
      <div><span class="k">実施年度</span><input type="text" id="f-year" placeholder="例：2026年度"></div>
      <div><span class="k">受検予定期間</span><input type="text" id="f-period" placeholder="例：2026/06/25〜07/31"></div>
      <div><span class="k">次の予定</span><input type="text" id="f-next" placeholder="例：高ストレス者選定基準の会社説明"></div>
      <div><span class="k">会社責任者</span><input type="text" id="f-owner" placeholder="氏名"></div>
      <div><span class="k">会社管理者</span><input type="text" id="f-manager" placeholder="氏名"></div>
      <div><span class="k">実施者</span><input type="text" id="f-jisshi" placeholder="氏名・未定なら空欄"></div>
      <div><span class="k">産業医</span><input type="text" id="f-doctor" placeholder="事業場ごとに違う場合は事業場名も併記"></div>
      <div><span class="k">企業のオンライン保健室担当者</span><input type="text" id="f-us" placeholder="氏名"></div>
    </div>
    <div class="stat-strip">
      <div class="item"><span class="num" id="stat-progress">—</span>全体進捗</div>
      <div class="item"><span class="num" id="stat-incomplete">—</span>未完了件数</div>
      <div class="item"><span class="num" id="stat-overdue">—</span>期限超過件数</div>
    </div>
    <p class="save-note" id="save-note">入力内容は会社名ごとにこのブラウザに自動保存されます</p>
  </div>

  <div class="b-shell">
    <nav class="b-nav">
      <div class="b-nav-scroll" id="chapNav"></div>
    </nav>
    <main class="b-main" id="chapMain"></main>
  </div>
</section>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <div class="chap-no" id="d-chapno">章2 — 担当者・実施体制</div>
      <h3 id="d-title">項目名</h3>
    </div>
    <button onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
  <div class="drawer-foot" id="d-foot"></div>
</div>

<p class="footer-note">企業のオンライン保健室 — ストレスチェック実施準備・運用確認台帳 ワイヤーフレーム v0.1（2026-07-20）</p>

<script>
(function(){
"use strict";

var CHAPTERS = [
  {no:0, title:"用語・役割の確認"},
  {no:1, title:"企業・事業場情報"},
  {no:2, title:"担当者・実施体制"},
  {no:3, title:"基本方針・実施目的"},
  {no:4, title:"衛生委員会等での審議"},
  {no:5, title:"実施規程"},
  {no:6, title:"システム準備"},
  {no:7, title:"受検対象者の決定・登録"},

function itemById(id){
  var found = null;
  Object.keys(ITEMS).forEach(function(k){ ITEMS[k].forEach(function(i){ if (i.id===id) found=i; }); });
  return found;
}
function isReqMet(item){
  var st = STATE[item.id];
  return (item.required||[]).every(function(k){ return st[k] && String(st[k]).trim() !== ""; });
}

var currentChap = "overview";

function counts(chapNo){
  var arr = ITEMS[chapNo];
  if (!arr) return null;
  var done = arr.filter(function(i){ return STATE[i.id].status === "完了"; }).length;
  return { done: done, total: arr.length };
}
function chapTurnClass(chapNo){
  var arr = ITEMS[chapNo];
  if (!arr) return "turn-none";
  var pending = arr.find(function(i){ return STATE[i.id].status !== "完了"; });
  if (!pending) return "turn-none";
  return TURN[STATE[pending.id].ownerGroup || pending.ownerGroup] || "turn-none";
}

function allItems(){
  var out = [];
  Object.keys(ITEMS).forEach(function(chapNo){
    ITEMS[chapNo].forEach(function(it){ out.push({ chapNo: chapNo, item: it }); });
  });
  return out;
}

function updateHeaderStats(){
  var all = allItems();
  var done = all.filter(function(x){ return STATE[x.item.id].status === "完了"; }).length;
  var overdue = all.filter(function(x){ return STATE[x.item.id].status === "期限超過"; }).length;
  var progress = all.length ? Math.round(done / all.length * 100) : 0;
  document.getElementById("stat-progress").textContent = progress + "%";
  document.getElementById("stat-incomplete").textContent = (all.length - done);
  document.getElementById("stat-overdue").textContent = overdue;
}

  CHAPTERS.forEach(function(c){

    btn.innerHTML =
      '<span class="no">' + String(c.no).padStart(2,"0") + '</span>' +

  html += '<div class="ov-divider">全項目（完了していないもの・確認が必要なものが上に来ます）</div>';

      '<td class="col-detail">詳細 ›</td>' +

function openDrawer(id){
  var item = itemById(id);
  if (!item) return;
  var chapNo = null;
  Object.keys(ITEMS).forEach(function(k){ if (ITEMS[k].indexOf(item) > -1) chapNo = k; });
  var chap = CHAPTERS.find(function(c){ return String(c.no) === String(chapNo); });
  var st = STATE[id];

  document.getElementById("d-chapno").textContent = "章" + chapNo + " — " + chap.title;
  document.getElementById("d-title").textContent = item.name;

  var body = '<span class="type-badge">' + item.type + '</span>';
  body += '<div class="d-block"><div class="d-label">項目の目的</div><div class="d-static">' + item.purpose + '</div></div>';
  body += '<div class="d-block"><div class="d-label">確認すべき内容</div><div class="d-static">' + (item.check || "—") + '</div></div>';
  if (item.options && item.options !== "—"){
    body += '<div class="d-block"><div class="d-label">選択肢</div><div class="d-static">' + item.options + '</div></div>';
  }

  body += '<div class="d-block"><div class="d-grid">';
  body += fieldHTML(id, "decision", "決定内容・確認結果", st.decision, isReqEmpty(item,"decision"));
  body += fieldHTML(id, "ownerGroup", "担当区分", st.ownerGroup, false, OWNER_GROUP_OPTIONS);
  body += fieldHTML(id, "owner", "担当者（氏名）", st.owner, false);
  body += fieldHTML(id, "plan", "予定日", st.plan, false, null, "date");
  body += fieldHTML(id, "done", "実施日／決定日", st.done, isReqEmpty(item,"done"), null, "date");
  body += fieldHTML(id, "confirmPlan", "確認予定日", st.confirmPlan, false, null, "date");
  body += fieldHTML(id, "confirmDone", "確認日", st.confirmDone, isReqEmpty(item,"confirmDone"), null, "date");
  body += fieldHTML(id, "confirmer", "確認者", st.confirmer, isReqEmpty(item,"confirmer"));
  body += '</div></div>';

  body += '<div class="d-block"><div class="d-label">ステータス</div>';
  body += '<select id="d-status-select">' + STATUS_OPTIONS.filter(function(s){ return s!=="完了"; }).map(function(s){
    return '<option ' + (s===st.status?"selected":"") + '>' + s + '</option>';
  }).join("") + '</select></div>';
  body += '<div class="d-block"><div class="d-label">法令上の区分</div><div class="d-static">' + item.law + '</div></div>';
  body += '<div class="d-block"><div class="d-label">根拠資料／添付資料</div><div class="d-static">（未添付）</div></div>';
  body += '<div class="d-block"><div class="d-label">備考</div><textarea id="d-note" rows="2">' + (st.note||"") + '</textarea></div>';

  document.getElementById("d-body").innerHTML = body;

  // wire up field inputs
  ["decision","ownerGroup","owner","plan","done","confirmPlan","confirmDone","confirmer"].forEach(function(key){
    var el = document.getElementById("d-" + id + "-" + key);
    if (!el) return;
    el.addEventListener("input", function(){ onFieldChange(item, key, el.value); });
    el.addEventListener("change", function(){ onFieldChange(item, key, el.value); });
  });
  document.getElementById("d-status-select").addEventListener("change", function(e){
    STATE[id].status = e.target.value;
    persistItems(); renderAll();
  });
  document.getElementById("d-note").addEventListener("input", function(e){
    STATE[id].note = e.target.value; persistItems();
  });

  renderCompleteBox(item);

  document.getElementById("overlay").classList.add("show");
  document.getElementById("drawer").classList.add("show");
}

function isReqEmpty(item, key){
  return (item.required||[]).indexOf(key) > -1 && !(STATE[item.id][key] && String(STATE[item.id][key]).trim());
}

function onFieldChange(item, key, value){
  var st = STATE[item.id];
  st[key] = value;
  // if this item was 完了 but the edit removed a required value, drop back to 確認待ち automatically
  if (st.status === "完了" && !isReqMet(item)){
    st.status = "確認待ち";
  }
  persistItems();
  renderCompleteBox(item);
  renderNav();
  updateHeaderStats();
}

function renderCompleteBox(item){
  var st = STATE[item.id];
  var met = isReqMet(item);
  var missingLabels = (item.required||[]).filter(function(k){ return !(st[k] && String(st[k]).trim()); }).map(function(k){ return FIELD_LABEL[k]; });

  var foot = '<div class="complete-box' + (!met && !(st.status==="完了") ? "" : "") + '">' +
    '<div class="cb-row"><input type="checkbox" id="d-complete-cb" ' + (st.status==="完了" ? "checked" : "") + '><span>完了</span></div>';
  if (st.status === "完了"){
    foot += '<div class="cb-note" style="color:var(--success-700)">完了になっています。チェックを外すといつでも取り消せます。</div>';
  } else if (!met){
    foot += '<div class="cb-note">以下が未入力のため「完了」にできません：<ul>' +
      missingLabels.map(function(f){ return "<li>" + f + "</li>"; }).join("") + '</ul></div>';
  } else {
    foot += '<div class="cb-note" style="color:var(--text-sub)">必須項目が揃っています。チェックを入れると完了になります。</div>';
  }
  foot += '</div>';
  document.getElementById("d-foot").innerHTML = foot;

  var cb = document.getElementById("d-complete-cb");
  cb.addEventListener("change", function(){
    var st2 = STATE[item.id];
    if (cb.checked){
      if (!isReqMet(item)){
        cb.checked = false; // reject the check; keep it blocked and re-show the note
        return;
      }
      st2.status = "完了";
    } else {
      st2.status = "確認待ち";
    }
    persistItems();
    renderCompleteBox(item);
    renderNav();
    renderMain();
    updateHeaderStats();
  });
}

function fieldHTML(itemId, key, label, value, isEmpty, options, type){
  var id = "d-" + itemId + "-" + key;
  var inner;
  if (options){
    inner = '<select id="' + id + '">' + '<option value="">選択してください</option>' +
      options.map(function(o){ return '<option ' + (o===value?"selected":"") + '>' + o + '</option>'; }).join("") + '</select>';
  } else {
    inner = '<input id="' + id + '" type="' + (type||"text") + '" value="' + (value||"").replace(/"/g,"&quot;") + '" placeholder="未入力">';
  }
  return '<div class="d-field' + (isEmpty ? " empty" : "") + '"><label>' + label + (isEmpty ? ' <span class="req">*未入力</span>' : '') + '</label>' + inner + '</div>';
}

function closeDrawer(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("drawer").classList.remove("show");
}

function renderAll(){ renderNav(); renderMain(); updateHeaderStats(); }

window.openDrawer = openDrawer;
window.closeDrawer = closeDrawer;

// ---------------- company header: editable + saved per company name ----------------
var FIELD_IDS = ["f-company","f-worksite","f-year","f-period","f-next","f-owner","f-manager","f-jisshi","f-doctor","f-us"];
var DEFAULTS = {
  "f-company":"",
  "f-worksite":"", "f-year":"2026年度", "f-period":"",
  "f-next":"",
  "f-owner":"", "f-manager":"", "f-jisshi":"", "f-doctor":"", "f-us":"髙橋由香"
};

function storageKey(){
  var name = (document.getElementById("f-company").value || "default").trim().toLowerCase();
  var slug = name.replace(/[^a-z0-9぀-ヿ一-龯]+/g, "-") || "default";
  return "sc_ledger_v1_" + slug;
}

var saveTimer;
function persistHeader(){
  try{
    var data = {};
    FIELD_IDS.forEach(function(id){ data[id] = document.getElementById(id).value; });
    localStorage.setItem(storageKey(), JSON.stringify(data));
    var note = document.getElementById("save-note");
    note.textContent = "保存しました";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ note.textContent = "入力内容は会社名ごとにこのブラウザに自動保存されます"; }, 1500);
  } catch(e){ /* localStorage unavailable */ }
}

function restoreHeader(useDefaultsIfEmpty){
  var data = null;
  try{
    var raw = localStorage.getItem(storageKey());
    if (raw) data = JSON.parse(raw);
  } catch(e){}
  FIELD_IDS.forEach(function(id){
    if (id === "f-company") return; // company name itself is the key; don't overwrite while typing
    if (data && typeof data[id] !== "undefined"){
      document.getElementById(id).value = data[id];
    } else if (useDefaultsIfEmpty){
      document.getElementById(id).value = DEFAULTS[id];
    }
  });
}

// ---------------- item checklist state: saved per company (same key as header) ----------------
function persistItems(){
  try{ localStorage.setItem(storageKey() + "_items", JSON.stringify(STATE)); } catch(e){}
}
function loadItemState(){
  var loaded = null;
  try{
    var raw = localStorage.getItem(storageKey() + "_items");
    if (raw) loaded = JSON.parse(raw);
  } catch(e){}
  var fresh = {};
  Object.keys(SEED).forEach(function(id){
    fresh[id] = (loaded && loaded[id]) ? loaded[id] : JSON.parse(JSON.stringify(SEED[id]));
  });
  STATE = fresh;
}

document.getElementById("f-company").value = DEFAULTS["f-company"];
restoreHeader(true);
loadItemState();
FIELD_IDS.forEach(function(id){
  document.getElementById(id).addEventListener("input", persistHeader);
});
document.getElementById("f-company").addEventListener("change", function(){
  restoreHeader(false);
  loadItemState();
  renderAll();
});

renderAll();
})();
</script>
