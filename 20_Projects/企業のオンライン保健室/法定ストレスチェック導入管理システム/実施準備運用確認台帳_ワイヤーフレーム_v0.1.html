<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ストレスチェック実施準備・運用確認台帳（ワイヤーフレーム）</title>
<style>
  :root{
    --brand:#74B2E0; --brand-deep:#2E6BA6; --brand-deeper:#1A3A5C; --brand-soft:#A3CDE8; --brand-line:#C5DDE9;
    --page-bg:#F2F8FC; --card-bg:#FFFFFF; --card-bg-tint:#F8FBFE;
    --text-heading:#1A3A5C; --text-body:#4A4A4A; --text-sub:#666666;
    --border:#E0E0E0; --border-soft:#D6E9F5;
    --success-50:#E6F5EB; --success-500:#28A745; --success-700:#1B7D3A;
    --warning-50:#FFF8E1; --warning-500:#F0AD00; --warning-700:#C68A00;
    --error-50:#FDEAEA; --error-500:#DC3545; --error-700:#B71C1C;
    --info-50:#F2F8FC;
    --font-head:"Hiragino Sans","Yu Gothic UI","Segoe UI",system-ui,sans-serif;
    --font-body:"Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",system-ui,sans-serif;
    --shadow-card: 0 1px 2px rgba(26,58,92,.06), 0 8px 24px rgba(26,58,92,.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page-bg:#0F1B2A; --card-bg:#1A2940; --card-bg-tint:#192538;
      --text-heading:#A3CDE8; --text-body:#CCDDEE; --text-sub:#8899AA;
      --border:#2A3950; --border-soft:#233350; --brand-line:#2A3950;
      --success-50:#12271B; --success-700:#7DD39B; --warning-50:#2A2311; --warning-700:#FFD666;
      --error-50:#2A1414; --error-700:#F09DA5; --info-50:#12233A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#0F1B2A; --card-bg:#1A2940; --card-bg-tint:#192538;
    --text-heading:#A3CDE8; --text-body:#CCDDEE; --text-sub:#8899AA;
    --border:#2A3950; --border-soft:#233350; --brand-line:#2A3950;
    --success-50:#12271B; --success-700:#7DD39B; --warning-50:#2A2311; --warning-700:#FFD666;
    --error-50:#2A1414; --error-700:#F09DA5; --info-50:#12233A;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --page-bg:#F2F8FC; --card-bg:#FFFFFF; --card-bg-tint:#F8FBFE;
    --text-heading:#1A3A5C; --text-body:#4A4A4A; --text-sub:#666666;
    --border:#E0E0E0; --border-soft:#D6E9F5; --brand-line:#C5DDE9;
    --success-50:#E6F5EB; --success-700:#1B7D3A; --warning-50:#FFF8E1; --warning-700:#C68A00;
    --error-50:#FDEAEA; --error-700:#B71C1C; --info-50:#F2F8FC;
    color-scheme: light;
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page-bg); color:var(--text-body); font-family:var(--font-body); font-size:14.5px; line-height:1.6; }
  h1,h2,h3{ font-family:var(--font-head); color:var(--text-heading); margin:0; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- wireframe chrome (not part of the product) ---------- */
  .wf-banner{
    background:var(--brand-deeper); color:#fff; padding:.5rem 1.2rem;
    font-size:.78rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap;
  }
  .wf-banner b{ background:rgba(255,255,255,.15); padding:.1rem .5rem; border-radius:999px; }
  .wf-tabs{ display:flex; gap:.4rem; }
  .wf-tabs button{
    border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; border-radius:999px;
    padding:.25rem .85rem; font-size:.78rem; font-weight:700;
  }
  .wf-tabs button.active{ background:#fff; color:var(--brand-deeper); }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ================= SCREEN A ================= */
  #screenA .wrap{ max-width:900px; margin:0 auto; padding:2.4rem 1.5rem 4rem; }
  #screenA .head{ margin-bottom:1.6rem; }
  #screenA .head .eyebrow{ font-size:.72rem; letter-spacing:.12em; font-weight:700; color:var(--brand-deep); text-transform:uppercase; }
  #screenA .head h1{ font-size:1.5rem; font-weight:800; margin:.3rem 0 .3rem; }
  #screenA .head p{ color:var(--text-sub); font-size:.9rem; margin:0; }

  .company-list{ display:flex; flex-direction:column; gap:.9rem; margin-top:1.4rem; }
  .company-card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:1.1rem 1.3rem;
    box-shadow:var(--shadow-card); display:grid; grid-template-columns:1.6fr 1fr 1fr auto; gap:1rem; align-items:center;
    cursor:pointer; transition:border-color .15s;
  }
  .company-card:hover{ border-color:var(--brand); }
  @media (max-width:760px){ .company-card{ grid-template-columns:1fr; } }
  .company-card .name{ font-weight:800; color:var(--text-heading); font-size:1.02rem; }
  .company-card .sub{ font-size:.78rem; color:var(--text-sub); margin-top:.15rem; }
  .company-card .stat{ font-size:.8rem; color:var(--text-body); }
  .company-card .stat b{ font-variant-numeric:tabular-nums; color:var(--text-heading); }
  .mini-bar{ height:6px; border-radius:999px; background:var(--border-soft); overflow:hidden; margin-top:.3rem; width:120px; }
  .mini-bar .fill{ height:100%; background:var(--brand); }
  .company-card .go{ font-size:.8rem; font-weight:700; color:var(--brand-deep); white-space:nowrap; }
  .add-company{
    border:1.5px dashed var(--brand-line); border-radius:14px; padding:1rem 1.3rem; text-align:center;
    color:var(--brand-deep); font-weight:700; font-size:.88rem; background:transparent;
  }

  /* ================= SCREEN B ================= */
  #screenB{ min-height:100vh; }
  .topstat{ background:linear-gradient(135deg, var(--brand-deep) 0%, var(--brand) 100%); color:#fff; padding:1.1rem 1.4rem; }
  .topstat .row1{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:.6rem; }
  .topstat .row1 .title{ font-size:1.15rem; font-weight:800; }
  .topstat .row1 .back{ font-size:.78rem; background:rgba(255,255,255,.18); border:none; color:#fff; padding:.3rem .8rem; border-radius:999px; }
  .topstat .row1 .title-input{
    font-family:var(--font-head); font-size:1.15rem; font-weight:800; color:#fff; background:transparent;
    border:none; border-bottom:1.5px solid rgba(255,255,255,.4); padding:.1rem .1rem; min-width:14em; outline:none;
  }
  .topstat .row1 .title-input::placeholder{ color:rgba(255,255,255,.65); font-weight:600; }
  .topstat .row1 .title-suffix{ font-size:1.02rem; font-weight:700; color:#EAF4FC; opacity:.9; }
  .topstat .meta-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem 1.4rem; margin-top:.8rem; font-size:.78rem;
  }
  @media (max-width:900px){ .topstat .meta-grid{ grid-template-columns:repeat(2,1fr); } }
  .topstat .meta-grid .k{ color:#DCEEFA; opacity:.85; display:block; margin-bottom:.15rem; }
  .topstat .meta-grid .v{ font-weight:700; }
  .topstat .meta-grid input{
    width:100%; font-family:var(--font-body); font-size:.85rem; font-weight:700; color:#fff; background:transparent;
    border:none; border-bottom:1px solid rgba(255,255,255,.35); padding:.1rem 0; outline:none;
  }
  .topstat .meta-grid input::placeholder{ color:rgba(255,255,255,.6); font-weight:500; }
  .topstat .save-note{ font-size:.7rem; color:#DCEEFA; opacity:.8; margin-top:.6rem; }
  .topstat .stat-strip{ display:flex; gap:1.6rem; margin-top:.9rem; flex-wrap:wrap; }
  .topstat .stat-strip .item{ font-size:.8rem; }
  .topstat .stat-strip .item .num{ font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; display:block; }

  .b-shell{ display:grid; grid-template-columns:270px minmax(0,1fr); }
  @media (max-width:860px){ .b-shell{ grid-template-columns:1fr; } }

  .b-nav{ border-right:1px solid var(--border); background:var(--card-bg); }
  @media (max-width:860px){ .b-nav{ border-right:none; border-bottom:1px solid var(--border); } }
  .b-nav-scroll{ max-height:calc(100vh - 148px); overflow-y:auto; padding:.8rem; }
  @media (max-width:860px){ .b-nav-scroll{ max-height:220px; } }
  .chap-btn{
    width:100%; text-align:left; border:none; background:transparent; border-radius:10px;
    padding:.55rem .7rem; display:flex; align-items:center; gap:.6rem; margin-bottom:.15rem; font-size:.83rem; color:var(--text-body);
  }
  .chap-btn:hover{ background:var(--card-bg-tint); }
  .chap-btn.active{ background:var(--info-50); color:var(--brand-deep); font-weight:700; border:1px solid var(--brand-line); }
  .chap-btn .no{ font-variant-numeric:tabular-nums; color:var(--text-sub); width:1.5em; flex:0 0 auto; }
  .chap-btn.active .no{ color:var(--brand-deep); }
  .chap-btn .lbl{ flex:1; min-width:0; }
  .chap-btn .cnt{ font-size:.68rem; color:var(--text-sub); font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .chap-btn .turn-dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .turn-company{ background:var(--warning-500); }
  .turn-us{ background:var(--brand); }
  .turn-jisshi{ background:var(--brand-deeper); }
  .turn-doctor{ background:var(--text-sub); }
  .turn-none{ background:var(--border); }

  .chap-btn.overview-btn{ background:var(--info-50); border:1px solid var(--brand-line); margin-bottom:.7rem; font-weight:700; color:var(--brand-deep); }
  .chap-btn.overview-btn.active{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .chap-btn.overview-btn .no{ color:inherit; }
  .nav-divider{ height:1px; background:var(--border); margin:.3rem .3rem .6rem; }

  /* ---------- overview screen ---------- */
  .ov-summary{ display:flex; flex-direction:column; gap:.35rem; margin-bottom:1.6rem; }
  .ov-row{
    display:grid; grid-template-columns:2.4rem 1fr 6rem 4.5rem 1rem; align-items:center; gap:.7rem;
    padding:.4rem .5rem; border-radius:8px; font-size:.8rem;
  }
  .ov-row:hover{ background:var(--card-bg-tint); }
  .ov-row .no{ font-variant-numeric:tabular-nums; color:var(--text-sub); }
  .ov-row .lbl{ color:var(--text-body); font-weight:600; }
  .ov-row .lbl.empty-chap{ color:var(--text-sub); font-weight:400; font-style:italic; }
  .ov-row .cnt{ font-variant-numeric:tabular-nums; color:var(--text-sub); text-align:right; }
  .ov-bar{ height:6px; border-radius:999px; background:var(--border-soft); overflow:hidden; }
  .ov-bar .fill{ height:100%; background:var(--success-700); }
  .ov-row .turn-dot{ width:7px; height:7px; border-radius:50%; justify-self:center; }

  .ov-divider{ font-size:.72rem; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.06em; margin:1.6rem 0 .6rem; }

  .b-main{ padding:1.4rem 1.6rem 4rem; }
  .b-main .chap-head{ display:flex; align-items:baseline; gap:.7rem; margin-bottom:.3rem; flex-wrap:wrap; }
  .b-main .chap-head h2{ font-size:1.15rem; font-weight:800; }
  .b-main .chap-head .no{ font-variant-numeric:tabular-nums; color:var(--brand); background:var(--info-50); border:1px solid var(--brand-line); border-radius:8px; padding:.1rem .5rem; font-weight:800; font-size:.85rem; }
  .b-main .chap-desc{ color:var(--text-sub); font-size:.85rem; margin:0 0 1.1rem; }

  .legend{ display:flex; gap:1rem; flex-wrap:wrap; font-size:.75rem; color:var(--text-sub); margin-bottom:.8rem; }
  .legend span{ display:inline-flex; align-items:center; gap:.35em; }
  .legend .dot{ width:7px; height:7px; border-radius:50%; }

  /* ---------- glossary (chapter 0) ---------- */
  .gl-search{
    display:flex; align-items:center; gap:.6rem; background:var(--card-bg); border:1.5px solid var(--border);
    border-radius:12px; padding:.6rem .9rem; margin-bottom:1.3rem; box-shadow:var(--shadow-card);
    position:sticky; top:0; z-index:5;
  }
  .gl-search input{
    flex:1; border:none; background:transparent; font-size:.95rem; color:var(--text-heading); outline:none; font-family:var(--font-body);
  }
  .gl-search .gl-count{ font-size:.76rem; color:var(--text-sub); white-space:nowrap; }
  .gl-jump{ display:flex; flex-wrap:wrap; gap:.35rem; margin-bottom:1.4rem; }
  .gl-jump a{
    font-size:.72rem; font-weight:700; color:var(--brand-deep); background:var(--info-50); border:1px solid var(--brand-line);
    border-radius:999px; padding:.2rem .65rem; text-decoration:none; cursor:pointer;
  }
  .gl-section{ margin:1.6rem 0 .8rem; scroll-margin-top:4.5rem; }
  .gl-section h3{ font-size:1.02rem; font-weight:800; color:var(--text-heading); border-bottom:2px solid var(--brand-line); padding-bottom:.4rem; }
  .gl-term{ background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:.8rem 1rem; margin:.6rem 0; }
  .gl-term .gl-term-name{ font-weight:800; color:var(--brand-deep); font-size:.92rem; margin-bottom:.35rem; }
  :root[data-theme="dark"] .gl-term .gl-term-name, [data-theme="dark"] .gl-term .gl-term-name{ color:var(--brand-soft); }
  .gl-term p{ margin:.3rem 0; font-size:.87rem; }
  .gl-term ul{ margin:.3rem 0; padding-left:1.3em; font-size:.87rem; }
  .gl-term .gl-note{ font-size:.8rem; color:var(--brand-deep); font-style:italic; margin-top:.35rem; }
  .gl-term mark{ background:var(--warning-300); color:inherit; border-radius:2px; }
  .gl-empty{ color:var(--text-sub); font-size:.85rem; padding:2rem; text-align:center; }

  .item-table{ width:100%; border-collapse:collapse; background:var(--card-bg); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow-card); }
  .item-table thead th{ background:var(--info-50); color:var(--text-heading); font-size:.72rem; font-weight:700; text-align:left; padding:.6rem .75rem; white-space:nowrap; }
  .item-table tbody td{ padding:.62rem .75rem; border-top:1px solid var(--border); font-size:.83rem; vertical-align:top; }
  .item-table tbody tr{ }
  .item-table tbody tr:hover{ background:var(--card-bg-tint); }
  .item-table tbody tr.is-done{ }
  .item-table .col-done{ width:2.2rem; text-align:center; }
  .item-table .check{ width:1.2em; height:1.2em; border-radius:5px; border:2px solid var(--border); display:inline-block; }
  .item-table .check.on{ background:var(--success-700); border-color:var(--success-700); position:relative; }
  .item-table .check.on::after{ content:"✓"; color:#fff; font-size:.7rem; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .item-table .name{ font-weight:700; color:var(--text-heading); }
  .item-table .name .type-tag{ display:block; font-size:.66rem; font-weight:600; color:var(--brand-deep); margin-top:.15rem; }
  .item-table .muted{ color:var(--text-sub); }
  .item-table .col-detail{ color:var(--brand-deep); font-size:.78rem; font-weight:700; white-space:nowrap; }

  .status-pill{ display:inline-flex; align-items:center; font-size:.7rem; font-weight:700; padding:.15rem .55rem; border-radius:999px; white-space:nowrap; }
  .st-未着手{ background:var(--card-bg-tint); color:var(--text-sub); border:1px solid var(--border); }
  .st-準備中{ background:var(--info-50); color:var(--brand-deep); border:1px solid var(--brand-line); }
  .st-実施中{ background:var(--brand-soft); color:var(--brand-deeper); }
  .st-確認待ち{ background:var(--warning-50); color:var(--warning-700); }
  .st-完了{ background:var(--success-50); color:var(--success-700); }
  .st-期限超過{ background:var(--error-50); color:var(--error-700); }
  .st-保留{ background:var(--card-bg-tint); color:var(--text-sub); border:1px dashed var(--border); }

  .owner-tag{ font-size:.7rem; color:var(--text-sub); }

  .placeholder-chap{ background:var(--card-bg); border:1px dashed var(--border); border-radius:12px; padding:2rem; text-align:center; color:var(--text-sub); font-size:.85rem; }

  /* ---------- detail drawer (screen C) ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(15,27,42,.35); display:none; z-index:40; }
  .overlay.show{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(480px,100%); background:var(--card-bg);
    box-shadow:-8px 0 30px rgba(0,0,0,.15); z-index:41; transform:translateX(100%); transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  .drawer.show{ transform:translateX(0); }
  @media (prefers-reduced-motion: reduce){ .drawer{ transition:none; } }
  .drawer-head{ padding:1.1rem 1.3rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:.8rem; }
  .drawer-head .chap-no{ font-size:.72rem; color:var(--brand-deep); font-weight:700; letter-spacing:.04em; }
  .drawer-head h3{ font-size:1.05rem; font-weight:800; margin:.2rem 0 0; }
  .drawer-head button{ border:none; background:var(--card-bg-tint); border-radius:8px; width:2em; height:2em; color:var(--text-sub); font-size:1rem; }
  .drawer-body{ padding:1.2rem 1.3rem; overflow-y:auto; flex:1; }
  .drawer-foot{ padding:1rem 1.3rem; border-top:1px solid var(--border); }

  .type-badge{ display:inline-block; font-size:.7rem; font-weight:700; padding:.2rem .6rem; border-radius:999px; background:var(--info-50); color:var(--brand-deep); border:1px solid var(--brand-line); margin-bottom:.9rem; }

  .d-block{ margin:0 0 1.3rem; }
  .d-block .d-label{ font-size:.72rem; font-weight:700; color:var(--text-sub); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.35rem; }
  .d-block .d-static{ font-size:.87rem; color:var(--text-body); background:var(--card-bg-tint); border:1px solid var(--border); border-radius:8px; padding:.55rem .7rem; line-height:1.6; }
  .d-grid{ display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
  .d-field label{ display:block; font-size:.72rem; font-weight:700; color:var(--text-sub); margin-bottom:.3rem; }
  .d-field input, .d-field select, .d-field textarea{
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:.45rem .6rem; font-size:.85rem;
    font-family:var(--font-body); color:var(--text-heading); background:var(--card-bg);
  }
  .d-field input:focus, .d-field select:focus, .d-field textarea:focus{ outline:none; border-color:var(--brand); }
  .d-block > select, .d-block > textarea{
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:.5rem .65rem; font-size:.87rem;
    font-family:var(--font-body); color:var(--text-heading); background:var(--card-bg); resize:vertical;
  }
  .d-block > select:focus, .d-block > textarea:focus{ outline:none; border-color:var(--brand); }
  .d-field.empty input, .d-field.empty select{ border-color:var(--warning-500); background:var(--warning-50); }
  .d-field .req{ color:var(--error-500); }

  .complete-box{ border:1px solid var(--border); border-radius:10px; padding:.9rem 1rem; background:var(--card-bg-tint); }
  .complete-box.blocked{ border-color:var(--warning-500); background:var(--warning-50); }
  .complete-box .cb-row{ display:flex; align-items:center; gap:.6rem; font-weight:700; color:var(--text-heading); font-size:.9rem; }
  .complete-box .cb-row input{ width:1.2em; height:1.2em; }
  .complete-box .cb-note{ font-size:.78rem; color:var(--warning-700); margin-top:.5rem; }
  .complete-box .cb-note ul{ margin:.3rem 0 0; padding-left:1.2em; }

  .footer-note{ max-width:1180px; margin:0 auto; padding:1.5rem; color:var(--text-sub); font-size:.78rem; }
</style>
</head>
<body>

<div class="wf-banner">
  <span>🧩 ワイヤーフレーム確認用（会社名を入力すれば、どの契約企業にも使い回せます）</span>
</div>

<!-- ========================= 台帳（会社ごとに1本・会社名を入力して使う） ========================= -->
<section id="screenB" class="screen active">
  <div class="topstat">
    <div class="row1">
      <input type="text" id="f-company" class="title-input" placeholder="◯◯株式会社">
      <span class="title-suffix">— ストレスチェック実施準備・運用確認台帳</span>
    </div>
    <div class="meta-grid">
      <div><span class="k">事業場名</span><input type="text" id="f-worksite" placeholder="例：全社"></div>
      <div><span class="k">実施年度</span><input type="text" id="f-year" placeholder="例：2026年度"></div>
      <div><span class="k">受検予定期間</span><input type="text" id="f-period" placeholder="例：2026/06/25〜07/31"></div>
      <div><span class="k">次の予定</span><input type="text" id="f-next" placeholder="例：高ストレス者選定基準の会社説明"></div>
      <div><span class="k">会社責任者</span><input type="text" id="f-owner" placeholder="氏名"></div>
      <div><span class="k">会社管理者</span><input type="text" id="f-manager" placeholder="氏名"></div>
      <div><span class="k">実施者</span><input type="text" id="f-jisshi" placeholder="氏名・未定なら空欄"></div>
      <div><span class="k">産業医</span><input type="text" id="f-doctor" placeholder="事業場ごとに違う場合は事業場名も併記"></div>
      <div><span class="k">企業のオンライン保健室担当者</span><input type="text" id="f-us" placeholder="氏名"></div>
    </div>
    <div class="stat-strip">

// base template state — every item starts blank / 未着手 for any newly duplicated company.
// (ownerGroup keeps the default responsible role so the table isn't empty, but nothing is
// pre-filled and nothing starts as 完了)
var SEED = {};
Object.keys(ITEMS).forEach(function(chapNo){
  ITEMS[chapNo].forEach(function(it){
    SEED[it.id] = { status:"未着手", decision:"", ownerGroup:it.ownerGroup, owner:"", plan:"", done:"", confirmPlan:"", confirmDone:"", confirmer:"", note:"" };
  });
});

var STATE = {}; // populated per company by loadItemState()
var FIELD_LABEL = { decision:"決定内容・確認結果", ownerGroup:"担当区分", owner:"担当者", plan:"予定日", done:"実施日／決定日", confirmPlan:"確認予定日", confirmDone:"確認日", confirmer:"確認者", note:"備考" };

function itemById(id){
  var found = null;
  Object.keys(ITEMS).forEach(function(k){ ITEMS[k].forEach(function(i){ if (i.id===id) found=i; }); });
  return found;
}
function isReqMet(item){
  var st = STATE[item.id];
  return (item.required||[]).every(function(k){ return st[k] && String(st[k]).trim() !== ""; });
}

// row-level conditional visibility: item.showIf = { itemId, key, equals }
// lets one item's decision (e.g. "登録方法を選ぶ") show/hide a whole downstream item.
function isItemVisible(item){
  if (!item.showIf) return true;
  var refSt = STATE[item.showIf.itemId];
  if (!refSt) return false;
  return refSt[item.showIf.key] === item.showIf.equals;
}

var currentChap = "overview";

function counts(chapNo){
  var arr = ITEMS[chapNo];
  if (!arr) return null;
  var visible = arr.filter(isItemVisible);
  var done = visible.filter(function(i){ return STATE[i.id].status === "完了"; }).length;
  return { done: done, total: visible.length };
}
function chapTurnClass(chapNo){
  var arr = ITEMS[chapNo];
  if (!arr) return "turn-none";
  var pending = arr.filter(isItemVisible).find(function(i){ return STATE[i.id].status !== "完了"; });
  if (!pending) return "turn-none";
  return TURN[STATE[pending.id].ownerGroup || pending.ownerGroup] || "turn-none";
}

function allItems(){
  var out = [];
  Object.keys(ITEMS).forEach(function(chapNo){
    ITEMS[chapNo].forEach(function(it){ if (isItemVisible(it)) out.push({ chapNo: chapNo, item: it }); });
  });
  return out;
}

function updateHeaderStats(){
  var all = allItems();
  var done = all.filter(function(x){ return STATE[x.item.id].status === "完了"; }).length;
  var overdue = all.filter(function(x){ return STATE[x.item.id].status === "期限超過"; }).length;
  var progress = all.length ? Math.round(done / all.length * 100) : 0;
  document.getElementById("stat-progress").textContent = progress + "%";
  document.getElementById("stat-incomplete").textContent = (all.length - done);
  document.getElementById("stat-overdue").textContent = overdue;
}

function renderNav(){
  var nav = document.getElementById("chapNav");
  nav.innerHTML = "";

  var ovBtn = document.createElement("button");
  ovBtn.className = "chap-btn overview-btn" + (currentChap === "overview" ? " active" : "");
  ovBtn.innerHTML = '<span class="no">📋</span><span class="lbl">全体チェック表（1枚で見る）</span>';
  ovBtn.addEventListener("click", function(){ currentChap = "overview"; renderNav(); renderMain(); });
  nav.appendChild(ovBtn);

  var div = document.createElement("div");
  div.className = "nav-divider";
  nav.appendChild(div);

  CHAPTERS.forEach(function(c){
    var btn = document.createElement("button");
    btn.className = "chap-btn" + (c.no === currentChap ? " active" : "");
    var cnt = counts(c.no);
    var dotClass = chapTurnClass(c.no);
    btn.innerHTML =
      '<span class="no">' + String(c.no).padStart(2,"0") + '</span>' +
      '<span class="lbl">' + c.title + '</span>' +
      (cnt ? '<span class="cnt">' + cnt.done + '/' + cnt.total + '</span>' : '') +
      '<span class="turn-dot ' + dotClass + '"></span>';
    btn.addEventListener("click", function(){ currentChap = c.no; renderNav(); renderMain(); });
    nav.appendChild(btn);
  });
}

// ---------------- inline row editing: choose from a checklist without opening the drawer ----------------
function templateCellHtml(it, st, locked){
  var boxStyle = "width:100%; border:1px solid var(--border); border-radius:6px; padding:.32rem .4rem; font-size:.82rem; font-family:var(--font-body);" +
    (locked ? "background:var(--card-bg-tint); color:var(--text-sub); cursor:not-allowed;" : "background:var(--card-bg); color:var(--text-heading);");
  var disabledAttr = locked ? "disabled" : "";
  var chosen = (typeof st.templateChoice === "number") ? st.templateChoice : -1;
  var isFree = chosen > -1 && it.textOptions[chosen] && it.textOptions[chosen].text === null;
  var html = '<div style="display:flex; flex-direction:column; gap:.3rem;">';
  html += '<select onclick="event.stopPropagation()" onchange="setTemplateInline(\'' + it.id + '\', this.value)" ' + disabledAttr + ' style="' + boxStyle + '">';
  html += '<option value="">テンプレートを選択</option>';
  it.textOptions.forEach(function(opt, i){
    html += '<option value="' + i + '" ' + (i===chosen?"selected":"") + '>' + escapeHtml(opt.label) + '</option>';
  });
  html += '</select>';
  if (isFree){
    html += '<textarea onclick="event.stopPropagation()" onchange="setDecisionInline(\'' + it.id + '\', this.value)" ' + disabledAttr + ' placeholder="自由入力" rows="2" style="width:100%; border:1px solid var(--border); border-radius:6px; padding:.3rem .4rem; font-size:.78rem; font-family:var(--font-body); resize:vertical;">' + escapeHtml(st.decision||"") + '</textarea>';
  } else if (chosen > -1 && st.decision){
    html += '<div style="font-size:.75rem; color:var(--text-body); line-height:1.6; white-space:pre-wrap; max-height:9em; overflow-y:auto; background:var(--card-bg-tint); border:1px solid var(--border); border-radius:6px; padding:.45rem .6rem;">' + escapeHtml(st.decision) + '</div>';
  }
  html += '</div>';
  return html;
}

window.setTemplateInline = function(id, idxStr){
  var item = itemById(id);
  var st = STATE[id];
  if (idxStr === "") return;
  var idx = parseInt(idxStr, 10);
  var opt = item.textOptions[idx];
  st.templateChoice = idx;
  if (typeof opt.text === "function") st.decision = opt.text();
  else st.decision = (opt.text === null) ? "" : opt.text;
  if (st.status === "完了" && !isReqMet(item)) st.status = "確認待ち";
  persistItems();
  renderNav(); updateHeaderStats(); renderMain();
};

function multiFieldCellHtml(it, st, locked){
  var html = '<div style="display:flex; flex-direction:column; gap:.35rem;">';
  it.fields.forEach(function(fd){
    if (fd.showIf){
      var sv = st[fd.showIf.key];
      if (fd.showIf.equals !== undefined && sv !== fd.showIf.equals) return;
      if (fd.showIf.in && fd.showIf.in.indexOf(sv) === -1) return;
    }
    var autoVal = (fd.autoFrom && STATE[fd.autoFrom]) ? (STATE[fd.autoFrom][fd.autoKey || "name"] || "") : "";
    var val = st[fd.key] || autoVal;
    var boxStyle = "width:100%; border:1px solid var(--border); border-radius:6px; padding:.24rem .4rem; font-size:.78rem; font-family:var(--font-body);" +
      (locked ? "background:var(--card-bg-tint); color:var(--text-sub);" : "background:var(--card-bg); color:var(--text-heading);");
    var disabledAttr = locked ? "disabled" : "";
    html += '<div style="display:flex; align-items:center; gap:.4rem;">';
    html += '<span style="font-size:.66rem; color:var(--text-sub); flex:0 0 auto; min-width:3.6em;">' + escapeHtml(fd.label) + '</span>';
    if (fd.type === "checkboxes"){
      var selected = val ? val.split("、") : [];
      html += '<div style="display:flex; flex-wrap:wrap; gap:.3rem;">';
      fd.options.forEach(function(o){
        var checked = selected.indexOf(o) > -1;
        html += '<label onclick="event.stopPropagation()" style="display:inline-flex; align-items:center; gap:.3em; font-size:.74rem; border:1px solid ' + (checked?"var(--brand)":"var(--border)") + '; border-radius:999px; padding:.18rem .6rem; background:' + (checked?"var(--info-50)":"var(--card-bg)") + '; color:' + (checked?"var(--brand-deep)":"var(--text-body)") + '; cursor:' + (locked?"not-allowed":"pointer") + ';">' +
          '<input type="checkbox" onchange="toggleCheckboxField(\'' + it.id + '\',\'' + fd.key + '\',\'' + o + '\', this.checked)" ' + (checked?"checked":"") + ' ' + disabledAttr + ' style="width:.9em; height:.9em; margin:0;">' + escapeHtml(o) + '</label>';
      });
      html += '</div>';
      if (fd.definitions && selected.length){
        html += '<div style="margin-top:.35rem; display:flex; flex-direction:column; gap:.25rem;">';
        selected.forEach(function(o){
          if (fd.definitions[o]){
            html += '<div style="font-size:.72rem; color:var(--text-body); background:var(--card-bg-tint); border:1px solid var(--border); border-radius:6px; padding:.35rem .55rem; line-height:1.6;"><b style="color:var(--text-heading);">' + escapeHtml(o) + '</b>：' + escapeHtml(fd.definitions[o]) + '</div>';
          }
        });
        html += '</div>';
      }
    } else if (fd.options && fd.combo){
      var listId = "mf-" + it.id + "-" + fd.key + "-list";
      html += '<input type="text" list="' + listId + '" value="' + escapeHtml(val).replace(/"/g,"&quot;") + '" onclick="event.stopPropagation()" onchange="setFieldInline(\'' + it.id + '\',\'' + fd.key + '\', this.value)" ' + disabledAttr + ' style="' + boxStyle + '">' +
        '<datalist id="' + listId + '">' + fd.options.map(function(o){ return '<option value="' + escapeHtml(o) + '">'; }).join("") + '</datalist>';
    } else if (fd.options){
      html += '<select onclick="event.stopPropagation()" onchange="setFieldInline(\'' + it.id + '\',\'' + fd.key + '\', this.value)" ' + disabledAttr + ' style="' + boxStyle + '">';
      html += '<option value="">選択</option>';
      fd.options.forEach(function(o){ html += '<option ' + (o===val?"selected":"") + '>' + escapeHtml(o) + '</option>'; });
      html += '</select>';
    } else if (fd.type === "date"){
      html += '<input type="date" value="' + val + '" onclick="event.stopPropagation()" onchange="setFieldInline(\'' + it.id + '\',\'' + fd.key + '\', this.value)" ' + disabledAttr + ' style="' + boxStyle + '">';
    } else if (fd.type === "file"){
      html += '<input type="file" accept="' + (fd.accept || ".doc,.docx,.pdf") + '" onclick="event.stopPropagation()" onchange="handleFileInline(\'' + it.id + '\',\'' + fd.key + '\', this)" ' + disabledAttr + ' style="' + boxStyle + ' padding:.12rem;">';
      if (val) html += '<span style="font-size:.7rem; color:var(--brand-deep); white-space:nowrap;">📎 ' + escapeHtml(val) + '</span>';
    } else if (fd.type === "textarea"){
      html += '<textarea onclick="event.stopPropagation()" onchange="setFieldInline(\'' + it.id + '\',\'' + fd.key + '\', this.value)" ' + disabledAttr + ' rows="2" placeholder="未入力" style="' + boxStyle + ' resize:vertical; font-family:var(--font-body);">' + escapeHtml(val) + '</textarea>';
    } else {
      html += '<input type="text" value="' + escapeHtml(val).replace(/"/g,"&quot;") + '" placeholder="未入力" onclick="event.stopPropagation()" onchange="setFieldInline(\'' + it.id + '\',\'' + fd.key + '\', this.value)" ' + disabledAttr + ' style="' + boxStyle + '">';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function referenceNoteHtml(it){
  if (!it.referenceNote) return "";
  return '<div style="margin-bottom:.35rem; font-size:.72rem; color:var(--text-body); background:var(--card-bg-tint); border:1px solid var(--border); border-radius:6px; padding:.4rem .55rem; line-height:1.7; white-space:pre-line;">' + escapeHtml(it.referenceNote) + '</div>';
}

function decisionCellHtml(it, st){
  var locked = st.status === "完了" && !it.noLock;
  if (it.fields) return referenceNoteHtml(it) + multiFieldCellHtml(it, st, locked);
  if (it.textOptions) return referenceNoteHtml(it) + templateCellHtml(it, st, locked);
  var opts = (it.options && it.options !== "—") ? it.options.split(/[／\/]/).map(function(s){ return s.trim(); }).filter(Boolean) : null;
  var boxStyle = "width:100%; border:1px solid var(--border); border-radius:6px; padding:.32rem .4rem; font-size:.82rem; font-family:var(--font-body);" +
    (locked ? "background:var(--card-bg-tint); color:var(--text-sub); cursor:not-allowed;" : "background:var(--card-bg); color:var(--text-heading);");
  var disabledAttr = locked ? "disabled" : "";
  if (opts && opts.length){
    var html = referenceNoteHtml(it);
    html += '<select onclick="event.stopPropagation()" onchange="setDecisionInline(\'' + it.id + '\', this.value)" ' + disabledAttr + ' style="' + boxStyle + '">';
    html += '<option value="">選択してください</option>';
    opts.forEach(function(o){
      html += '<option ' + (o === st.decision ? "selected" : "") + '>' + escapeHtml(o) + '</option>';
    });
    html += '</select>';
    if (it.warnIfDecision && st.decision === it.warnIfDecision){
      html += '<div style="margin-top:.35rem; font-size:.74rem; font-weight:700; color:var(--error-700); background:var(--error-50); border-radius:6px; padding:.35rem .5rem;">' + escapeHtml(it.warnText||"この選択は要注意です。") + '</div>';
    }

  return '<input type="text" value="' + escapeHtml(st.decision||"").replace(/"/g,"&quot;") + '" placeholder="未入力" onclick="event.stopPropagation()" onchange="setDecisionInline(\'' + it.id + '\', this.value)" ' + disabledAttr + ' style="' + boxStyle + '">';
}

var SIMPLE_STATUS = ["未着手","保留中","完了"];

function simpleStatus(st){
  if (st.status === "完了") return "完了";
  if (st.status === "保留" || st.status === "保留中") return "保留中";
  return "未着手";
}

function statusCellHtml(it, st){

  var current = simpleStatus(st);

function dateCellHtml(it, st, key){

window.setDecisionInline = function(id, value){
  var item = itemById(id);
  var st = STATE[id];
  st.decision = value;
  if (st.status === "完了" && !isReqMet(item)) st.status = "確認待ち";
  persistItems();
  renderNav(); updateHeaderStats(); renderMain();
};

window.setFieldInline = function(id, key, value){
  STATE[id][key] = value;
  persistItems();
  renderNav(); updateHeaderStats(); renderMain();
};

window.handleFileInline = function(id, key, inputEl){
  var f = inputEl.files && inputEl.files[0];
  STATE[id][key] = f ? f.name : "";
  persistItems();
  renderNav(); updateHeaderStats(); renderMain();
};

window.toggleCheckboxField = function(id, key, optionValue, isChecked){
  var current = STATE[id][key] ? STATE[id][key].split("、") : [];
  var idx = current.indexOf(optionValue);
  if (isChecked && idx === -1) current.push(optionValue);
  if (!isChecked && idx > -1) current.splice(idx, 1);
  STATE[id][key] = current.join("、");
  persistItems();
  renderNav(); updateHeaderStats(); renderMain();
};

var glossaryQuery = "";

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function highlight(text, query){
  var safe = escapeHtml(text);
  if (!query) return safe;
  var idx = safe.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return safe;
  return safe.slice(0, idx) + "<mark>" + safe.slice(idx, idx + query.length) + "</mark>" + safe.slice(idx + query.length);
}
function blockMatches(term, blocks, query){
  if (!query) return true;
  var q = query.toLowerCase();
  if (term.toLowerCase().indexOf(q) > -1) return true;
  return blocks.some(function(b){
    if (b.t === "ul") return b.x.some(function(i){ return i.toLowerCase().indexOf(q) > -1; });
    return b.x.toLowerCase().indexOf(q) > -1;
  });
}

function renderGlossary(){
  var main = document.getElementById("chapMain");
  var query = glossaryQuery;

  var html = '<div class="chap-head"><span class="no">00</span><h2>用語・役割の確認</h2></div>';
  html += '<p class="chap-desc">ストレスチェック関係者向け用語集。参照用の情報であり、チェック・記録項目はありません。</p>';

  html += '<div class="gl-search"><input type="text" id="gl-search-input" placeholder="用語・説明文で検索（例：高ストレス者、少人数集団）" value="' + escapeHtml(query) + '">' +
    '<span class="gl-count" id="gl-count"></span></div>';

  html += '<div class="gl-jump">' + GLOSSARY.map(function(sec, i){
    return '<a onclick="jumpToGlossarySection(' + i + ')">' + sec.title + '</a>';
  }).join('') + '</div>';

  var shown = 0, total = 0;
  GLOSSARY.forEach(function(sec, si){
    var matchedTerms = sec.terms.filter(function(t){ total++; return blockMatches(t.term, t.body, query); });
    if (matchedTerms.length === 0) return;
    shown += matchedTerms.length;
    html += '<div class="gl-section" id="gl-sec-' + si + '"><h3>' + escapeHtml(sec.title) + '</h3>';
    matchedTerms.forEach(function(t){
      html += '<div class="gl-term"><div class="gl-term-name">' + highlight(t.term, query) + '</div>';
      t.body.forEach(function(b){
        if (b.t === "p"){
          html += '<p>' + highlight(b.x, query) + '</p>';
        } else if (b.t === "ul"){
          html += '<ul>' + b.x.map(function(i){ return '<li>' + highlight(i, query) + '</li>'; }).join('') + '</ul>';
        } else if (b.t === "note"){
          html += '<p class="gl-note">※ ' + highlight(b.x, query) + '</p>';
        }
      });
      html += '</div>';
    });
    html += '</div>';
  });

  if (shown === 0){
    html += '<div class="gl-empty">「' + escapeHtml(query) + '」に一致する用語は見つかりませんでした。</div>';
  }

  main.innerHTML = html;
  document.getElementById("gl-count").textContent = query ? (shown + " / " + total + " 件") : (total + " 件");
  var input = document.getElementById("gl-search-input");
  input.addEventListener("input", function(){
    glossaryQuery = input.value;
    renderGlossary();
    document.getElementById("gl-search-input").focus();
    var v = document.getElementById("gl-search-input").value;
    document.getElementById("gl-search-input").setSelectionRange(v.length, v.length);
  });
}

  body += '<div class="d-block"><div class="d-label">確認すべき内容</div><div class="d-static">' + (item.check || "—") + '</div></div>';

    showFields.forEach(function(fd){
      if (fd.showIf){
        var sv = st[fd.showIf.key];
        if (fd.showIf.equals !== undefined && sv !== fd.showIf.equals) return;
        if (fd.showIf.in && fd.showIf.in.indexOf(sv) === -1) return;
      }
      fieldKeys.push(fd.key);
      body += fieldHTML(id, fd.key, fd.label, st[fd.key], isReqEmpty(item, fd.key), fd.options || null, fd.type || null, locked, fd.combo);
    });
  } else {
    var FIELD_DEFS = {
      decision: function(){ return fieldHTML(id, "decision", "決定内容・確認結果", st.decision, isReqEmpty(item,"decision"), null, null, locked); },
      ownerGroup: function(){ return fieldHTML(id, "ownerGroup", "担当区分", st.ownerGroup, false, OWNER_GROUP_OPTIONS, null, locked); },

      confirmPlan: function(){ return fieldHTML(id, "confirmPlan", "確認予定日", st.confirmPlan, false, null, "date", locked); },

      confirmer: function(){ return fieldHTML(id, "confirmer", "確認者", st.confirmer, isReqEmpty(item,"confirmer"), null, null, locked); }
    };
    showFields.forEach(function(key){ fieldKeys.push(key); body += FIELD_DEFS[key](); });
  }
  body += '</div></div>';

  if (isCustom || showFields.length > 1 || showFields[0] !== "decision"){

function isReqEmpty(item, key){
  return (item.required||[]).indexOf(key) > -1 && !(STATE[item.id][key] && String(STATE[item.id][key]).trim());
}

function onFieldChange(item, key, value){
  var st = STATE[item.id];
  st[key] = value;
  // if this item was 完了 but the edit removed a required value, drop back to 確認待ち automatically
  if (st.status === "完了" && !isReqMet(item)){
    st.status = "確認待ち";
  }
  persistItems();
  renderCompleteBox(item);
  renderNav();
  updateHeaderStats();
}

function renderCompleteBox(item){
  var st = STATE[item.id];
  var met = isReqMet(item);
  var customLabels = {};
  if (item.fields && item.fields.length && typeof item.fields[0] === "object"){
    item.fields.forEach(function(fd){ customLabels[fd.key] = fd.label; });
  }
  var missingLabels = (item.required||[]).filter(function(k){ return !(st[k] && String(st[k]).trim()); }).map(function(k){ return customLabels[k] || FIELD_LABEL[k] || k; });

  var foot = '<div class="complete-box' + (!met && !(st.status==="完了") ? "" : "") + '">' +
    '<div class="cb-row"><input type="checkbox" id="d-complete-cb" ' + (st.status==="完了" ? "checked" : "") + '><span>完了</span></div>';
  if (st.status === "完了"){
    foot += '<div class="cb-note" style="color:var(--success-700)">完了になっています（ロック中・編集不可）。チェックを外すといつでも編集を再開できます。</div>';
  } else if (!met){
    foot += '<div class="cb-note">以下が未入力のため「完了」にできません：<ul>' +
      missingLabels.map(function(f){ return "<li>" + f + "</li>"; }).join("") + '</ul></div>';
  } else {
    foot += '<div class="cb-note" style="color:var(--text-sub)">必須項目が揃っています。チェックを入れると完了になります。</div>';
  }
  foot += '</div>';
  document.getElementById("d-foot").innerHTML = foot;

  var cb = document.getElementById("d-complete-cb");
  cb.addEventListener("change", function(){
    var st2 = STATE[item.id];
    if (cb.checked){
      if (!isReqMet(item)){
        cb.checked = false; // reject the check; keep it blocked and re-show the note
        return;
      }
      st2.status = "完了";
    } else {
      st2.status = "確認待ち";
    }
    persistItems();
    renderCompleteBox(item);
    renderNav();
    renderMain();
    updateHeaderStats();
  });
}

function fieldHTML(itemId, key, label, value, isEmpty, options, type, locked, combo){
  var id = "d-" + itemId + "-" + key;
  var disabledAttr = locked ? "disabled" : "";
  var inner;
  if (options && combo){
    var listId = id + "-list";
    inner = '<input id="' + id + '" list="' + listId + '" type="text" value="' + (value||"").replace(/"/g,"&quot;") + '" placeholder="入力または候補から選択" ' + disabledAttr + '>' +
      '<datalist id="' + listId + '">' + options.map(function(o){ return '<option value="' + o + '">'; }).join("") + '</datalist>';
  } else if (options){
    inner = '<select id="' + id + '" ' + disabledAttr + '>' + '<option value="">選択してください</option>' +
      options.map(function(o){ return '<option ' + (o===value?"selected":"") + '>' + o + '</option>'; }).join("") + '</select>';
  } else {
    inner = '<input id="' + id + '" type="' + (type||"text") + '" value="' + (value||"").replace(/"/g,"&quot;") + '" placeholder="未入力" ' + disabledAttr + '>';
  }
  return '<div class="d-field' + (isEmpty ? " empty" : "") + '"><label>' + label + (isEmpty ? ' <span class="req">*未入力</span>' : '') + '</label>' + inner + '</div>';
}

function closeDrawer(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("drawer").classList.remove("show");
}

function renderAll(){ renderNav(); renderMain(); updateHeaderStats(); }

window.openDrawer = openDrawer;
window.closeDrawer = closeDrawer;

// ---------------- company header: editable + saved per company name ----------------
var FIELD_IDS = ["f-company","f-worksite","f-year","f-period","f-next","f-owner","f-manager","f-jisshi","f-doctor","f-us"];
var DEFAULTS = {
  "f-company":"",
  "f-worksite":"", "f-year":"2026年度", "f-period":"",
  "f-next":"",
  "f-owner":"", "f-manager":"", "f-jisshi":"", "f-doctor":"", "f-us":"髙橋由香"
};

function storageKey(){
  var name = (document.getElementById("f-company").value || "default").trim().toLowerCase();
  var slug = name.replace(/[^a-z0-9぀-ヿ一-龯]+/g, "-") || "default";
  return "sc_ledger_v1_" + slug;
}

var saveTimer;
function persistHeader(){
  try{
    var data = {};
    FIELD_IDS.forEach(function(id){ data[id] = document.getElementById(id).value; });
    localStorage.setItem(storageKey(), JSON.stringify(data));
    var note = document.getElementById("save-note");
    note.textContent = "保存しました";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ note.textContent = "入力内容は会社名ごとにこのブラウザに自動保存されます"; }, 1500);
  } catch(e){ /* localStorage unavailable */ }
}

function restoreHeader(useDefaultsIfEmpty){
  var data = null;
  try{
    var raw = localStorage.getItem(storageKey());
    if (raw) data = JSON.parse(raw);
  } catch(e){}
  FIELD_IDS.forEach(function(id){
    if (id === "f-company") return; // company name itself is the key; don't overwrite while typing
    if (data && typeof data[id] !== "undefined"){
      document.getElementById(id).value = data[id];
    } else if (useDefaultsIfEmpty){
      document.getElementById(id).value = DEFAULTS[id];
    }
  });
}

// ---------------- item checklist state: saved per company (same key as header) ----------------
function persistItems(){
  try{ localStorage.setItem(storageKey() + "_items", JSON.stringify(STATE)); } catch(e){}
}
function loadItemState(){
  var loaded = null;
  try{
    var raw = localStorage.getItem(storageKey() + "_items");
    if (raw) loaded = JSON.parse(raw);
  } catch(e){}
  var fresh = {};
  Object.keys(SEED).forEach(function(id){
    fresh[id] = (loaded && loaded[id]) ? loaded[id] : JSON.parse(JSON.stringify(SEED[id]));
  });
  STATE = fresh;
}

// ---------------- Chapter 1: repeatable "拠点情報" cards ----------------
// 企業名・所在地・業種・産業医・担当者を1件のカードにまとめる。部署や店舗が複数ある場合はカードを追加する。
var DOCTOR_OPTIONS = ["契約中の産業医あり","企業のオンライン保健室に任せる","地域産業保健センターから探す","未定"];

function makeSiteItem(sid){
  return {
    id: "c1-site-" + sid,
    name: "拠点情報",
    type: "決定する項目",
    ownerGroup: "会社担当者",
    purpose: "企業名・所在地・業種・産業医・担当者の情報を1件にまとめて確認する。複数の部署や店舗がある場合は、拠点ごとにカードを追加する。",
    check: "産業医が未契約の場合は、企業のオンライン保健室に任せるか、地域産業保健センター（地さんぽ）から候補を探す。（今後、都道府県別に産業医を無料で探せる一覧を案内できるとなおよい）",
    options: "—",
    law: "契約上必要",
    required: ["companyName","address","industry","doctorStatus","contactName","contactPhone"],
    fields: [
      { key:"companyName", label:"企業名" },
      { key:"address", label:"所在地" },
      { key:"industry", label:"業種" },
      { key:"doctorStatus", label:"産業医", options: DOCTOR_OPTIONS },
      { key:"doctorDetail", label:"産業医名・連絡先（いる場合）" },
      { key:"contactName", label:"担当者氏名" },
      { key:"contactPhone", label:"担当者連絡先" }
    ]
  };
}

var SITES = [];

function blankSiteState(it){
  var st = { status:"未着手", ownerGroup:it.ownerGroup, note:"" };
  it.fields.forEach(function(fd){ st[fd.key] = ""; });
  return st;
}

function persistSites(){
  try{ localStorage.setItem(storageKey() + "_sites", JSON.stringify(SITES)); } catch(e){}
}

function loadSites(){
  ITEMS[1] = ITEMS[1].filter(function(it){ return it.id.indexOf("c1-site-") !== 0; });
  SITES = [];
  try{
    var raw = localStorage.getItem(storageKey() + "_sites");
    if (raw) SITES = JSON.parse(raw);
  } catch(e){}
  SITES.forEach(function(s){
    var it = makeSiteItem(s.id);
    ITEMS[1].push(it);
    if (!SEED[it.id]) SEED[it.id] = blankSiteState(it);
  });
}

function addSite(){
  var sid = "s" + Date.now();
  SITES.push({ id:sid, label:"拠点" + (SITES.length + 1) });
  var it = makeSiteItem(sid);
  ITEMS[1].push(it);
  SEED[it.id] = blankSiteState(it);
  STATE[it.id] = JSON.parse(JSON.stringify(SEED[it.id]));
  persistSites(); persistItems(); renderAll();
}
window.addSite = addSite;

function removeSite(sid){
  if (!confirm("この拠点情報を削除しますか？入力済みの内容も削除されます。")) return;
  SITES = SITES.filter(function(s){ return s.id !== sid; });
  var id = "c1-site-" + sid;
  ITEMS[1] = ITEMS[1].filter(function(it){ return it.id !== id; });
  delete STATE[id]; delete SEED[id];
  persistSites(); persistItems(); renderAll();
}
window.removeSite = removeSite;

function renameSite(sid, label){
  var s = SITES.find(function(s){ return s.id === sid; });
  if (s){ s.label = label; persistSites(); }
}
window.renameSite = renameSite;

function renderChapter1(){
  var main = document.getElementById("chapMain");
  var chap = CHAPTERS.find(function(c){ return c.no === 1; });

  var html = '<div class="chap-head"><span class="no">01</span><h2>' + chap.title + '</h2></div>';
  html += '<p class="chap-desc">企業名・所在地・業種・産業医・担当者をまとめた「拠点情報」です。部署や店舗が複数ある場合は、拠点ごとにカードを追加してください。</p>';

  SITES.forEach(function(s){
    var id = "c1-site-" + s.id;
    var it = itemById(id);
    var st = STATE[id];
    html += '<div class="card" style="margin:0 0 .9rem;">';
    html += '<div style="display:flex; align-items:center; gap:.6rem; margin-bottom:.6rem;">' +
      '<input type="text" value="' + escapeHtml(s.label) + '" data-sid="' + s.id + '" class="site-label-input" style="font-weight:800; font-size:.95rem; color:var(--text-heading); border:none; border-bottom:1.5px solid var(--border); background:transparent; padding:.15rem 0; flex:1; outline:none;">' +
      '<span class="status-pill st-' + st.status + '">' + st.status + '</span>' +
      '<button onclick="removeSite(\'' + s.id + '\')" style="border:1px solid var(--border); background:var(--card-bg-tint); color:var(--text-sub); border-radius:8px; padding:.3rem .7rem; font-size:.76rem;">✕ 削除</button>' +
    '</div>';
    html += '<div style="font-size:.85rem; color:var(--text-body); display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:.5rem .9rem; margin-bottom:.7rem;">';
    it.fields.forEach(function(fd){
      var v = st[fd.key];
      html += '<div><span style="color:var(--text-sub); font-size:.72rem; display:block;">' + fd.label + '</span>' + (v ? escapeHtml(v) : '<span class="muted">未入力</span>') + '</div>';
    });
    html += '</div>';
    html += '<button onclick="openDrawer(\'' + id + '\')" style="font-size:.8rem; font-weight:700; color:var(--brand-deep); background:var(--info-50); border:1px solid var(--brand-line); border-radius:8px; padding:.4rem .9rem;">詳細を開く・編集する ›</button>';
    html += '</div>';
  });

  if (!SITES.length){
    html += '<div class="placeholder-chap">まだ拠点情報が登録されていません。下のボタンから追加してください。</div>';
  }

  html += '<button onclick="addSite()" class="add-company" style="margin-top:.6rem; width:100%; border-radius:12px; cursor:pointer;">＋ 拠点情報を追加する（部署・店舗が複数ある場合）</button>';

  main.innerHTML = html;

  document.querySelectorAll(".site-label-input").forEach(function(inp){
    inp.addEventListener("change", function(){ renameSite(inp.dataset.sid, inp.value); });
  });
}

document.getElementById("f-company").value = DEFAULTS["f-company"];
restoreHeader(true);
loadSites();
loadItemState();
FIELD_IDS.forEach(function(id){
  document.getElementById(id).addEventListener("input", persistHeader);
});
document.getElementById("f-company").addEventListener("change", function(){
  restoreHeader(false);
  loadSites();
  loadItemState();
  renderAll();
});

renderAll();
})();
</script>
</body>
</html>
